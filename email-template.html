<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Membership Expiry Notice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #111827;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .header {
            background-color: #1f2937;
            padding: 20px;
            border-radius: 8px 8px 0 0;
        }
        .header h1 {
            color: #38bdf8;
            margin: 0;
        }
        .content {
            padding: 20px;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            margin-top: 20px;
            background-color: #38bdf8;
            color: #0a0a0a;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #d1d5db;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Gym Membership Expiry Notice</h1>
        </div>
        <div class="content">
            <p>Hi [Member Name],</p>
            <p>Your gym membership is set to expire on <strong>[Expiry Date]</strong>. Renew today to continue your fitness journey without interruptions.</p>
            <a href="#" class="button">Renew Membership</a>
            <p>Stay fit, stay strong!</p>
        </div>
        <div class="footer">
            <p>&copy; 2025 Your Gym | <a href="#" style="color: #38bdf8;">Unsubscribe</a></p>
        </div>
    </div>
</body>
</html>
